<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.3" flood-color="#000000"/>
    </filter>
  </defs>

  <!-- App Rounded Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Inner Notebook Cover -->
  <rect x="96" y="88" width="320" height="336" rx="28" fill="#0f172a" opacity="0.35" />
  <rect x="108" y="100" width="296" height="312" rx="22" fill="url(#pageGrad)" />

  <!-- Spine Ribbon -->
  <path d="M108 100 H148 V412 H108 Z" fill="#3b82f6" opacity="0.25" />

  <!-- Horizontal Note Lines -->
  <rect x="180" y="160" width="180" height="16" rx="8" fill="#3b82f6" opacity="0.8" />
  <rect x="180" y="208" width="196" height="12" rx="6" fill="#94a3b8" />
  <rect x="180" y="248" width="160" height="12" rx="6" fill="#94a3b8" />
  <rect x="180" y="288" width="184" height="12" rx="6" fill="#94a3b8" />
  <rect x="180" y="328" width="150" height="12" rx="6" fill="#94a3b8" />
  <rect x="180" y="364" width="120" height="12" rx="6" fill="#94a3b8" />
  
  <!-- Feather / Pen Quill Accent -->
  <path d="M370 120 C320 180 260 270 230 360 C250 340 310 320 340 260 C365 210 385 150 370 120 Z" fill="#f59e0b" filter="url(#shadow)" />
  <circle cx="232" cy="362" r="6" fill="#d97706" />
</svg>
