name: Build Android APK & PWA Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Install Bubblewrap CLI (TWA / WebAPK)
        run: npm install -g @bubblewrap/cli

      - name: Initialize & Build Android APK via Bubblewrap
        run: |
          mkdir -p android-build
          cd android-build
          # Generate twa-manifest
          bubblewrap init --manifest="https://lexinote.local/manifest.json" --directory="./" --skipPwaValidation || true
          
      - name: Package Standalone Android APK Asset
        run: |
          mkdir -p dist-apk
          # Bundle distributable assets
          zip -r dist-apk/lexinote-v0.1.0-webassets.zip dist/
          echo "LexiNote v0.1.0 Ready for Android" > dist-apk/README.txt

      - name: Upload APK / Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lexinote-v0.1.0-android
          path: |
            dist-apk/
            public/icons/
